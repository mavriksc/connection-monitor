services:
  connection-monitor:
    build: .
    image: connection-monitor:local
    ports:
      - "3000:3000"
    environment:
      HOSTS: 8.8.8.8,google.com,amazon.com # comma-separated hosts to ping
      POLL_RATE: 5 # polling interval in seconds
      ALWAYS_ON: true # true: always poll; false: poll only while the UI has an SSE connection
      UNCOMPRESSED_LOG_DAYS: 0 # days of loose .log files to keep before adding older logs to logs.zip
    volumes:
      - ./docker-logs:/usr/src/app/logs
